# Manually dispatched probe for the Windows-only speech backend failures
# diagnosed on 2026-09-01: installs the released app on a windows runner and
# runs scripts/azure-wintest-remote.ps1 (OMP duplicate-runtime clash, the
# KMP_DUPLICATE_LIB_OK workaround, and CPU-speed calibration).
name: Windows speech probe

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build Windows run id whose windows-setup artifact to test (public releases predate the speech feature)"
        required: false
        default: "33490363522"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download windows-setup artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: setup-dl
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install app and run speech probes
        shell: pwsh
        run: |
          $env:SETUP_EXE = (Get-ChildItem setup-dl -Filter *.exe | Select-Object -First 1).FullName
          ./scripts/azure-wintest-remote.ps1
