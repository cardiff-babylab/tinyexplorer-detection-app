name: Build macOS

on:
  # push:
  #   branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Build only for Apple Silicon (ARM64)
    runs-on: macos-14
    timeout-minutes: 45

    env:
      ARCH: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm install

    - name: Install tar module for Python bundling
      run: npm install tar

    - name: Build Python bundle with standalone interpreter
      run: node scripts/bundle-python-standalone.js
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: '1'

    - name: Check pythondist has no dangling symlinks
      run: |
        # Any broken symlink inside the bundled Python tree will surface as
        # confusing "xattr: No such file" warnings when end users strip the
        # macOS quarantine attribute. Fail the build instead of shipping them.
        broken=$(find pythondist -type l ! -exec test -e {} \; -print || true)
        if [ -n "$broken" ]; then
          echo "Dangling symlinks found in pythondist:"
          echo "$broken"
          exit 1
        fi
        echo "No dangling symlinks in pythondist."

    - name: Verify and test YOLO environment
      env:
        SMOKE_TEST_YOLO: '1'
      run: |
        YOLO_PY="$(pwd)/pythondist/yolo-env/bin/python"
        
        # Verify core YOLO requirements
        "$YOLO_PY" - << 'PY'
        import sys
        
        def check(mod_name, display=None):
            try:
                if mod_name == 'cv2':
                    import cv2
                    ver = cv2.__version__
                elif mod_name == 'PIL':
                    import PIL
                    ver = PIL.__version__
                elif mod_name == 'torch':
                    import torch
                    ver = torch.__version__
                elif mod_name == 'torchvision':
                    import torchvision
                    ver = torchvision.__version__
                elif mod_name == 'ultralytics':
                    import ultralytics
                    ver = ultralytics.__version__
                else:
                    mod = __import__(mod_name)
                    ver = getattr(mod, '__version__', '0')
                name = display or mod_name
                print(f"OK: {name} {ver}")
            except Exception as e:
                print(f"FAIL: {mod_name} not usable: {e}")
                sys.exit(1)
        
        check('numpy', display='numpy')
        check('PIL', display='Pillow')
        check('cv2', display='opencv-python')
        check('torch', display='PyTorch')
        check('torchvision', display='torchvision')
        check('ultralytics', display='ultralytics')
        PY
        
        # Smoke test YOLO import and basic functionality
        node scripts/verify-python-modules.js

    - name: Verify and test RetinaFace environment
      env:
        SMOKE_TEST_RETINAFACE: '1'
      run: |
        RF_PY="$(pwd)/pythondist/retinaface-env/bin/python"
        
        # Verify all requirements
        "$RF_PY" - << 'PY'
        import sys

        # pkg_resources (setuptools) is no longer bundled with modern
        # python-build-standalone interpreters. Use packaging.version
        # which retina-face / tensorflow already pull in transitively.
        try:
            from packaging.version import parse as parse_version
        except ImportError:
            # Tuple fallback: only handles plain "X.Y.Z" releases.
            def parse_version(s):
                return tuple(int(p) for p in s.split('+')[0].split('.')[:3] if p.isdigit())

        def check(mod_name, attr='__version__', min_ver=None, display=None):
            try:
                if mod_name == 'cv2':
                    import cv2
                    ver = cv2.__version__
                elif mod_name == 'PIL':
                    import PIL
                    ver = PIL.__version__
                else:
                    mod = __import__(mod_name)
                    ver = getattr(mod, attr, '0')
                name = display or mod_name
                if min_ver and parse_version(ver) < parse_version(min_ver):
                    print(f"{name} {ver} < required {min_ver}")
                    sys.exit(1)
                print(f"OK: {name} {ver}")
            except Exception as e:
                print(f"FAIL: {mod_name} not usable: {e}")
                sys.exit(1)

        check('numpy', min_ver='1.14.0', display='numpy')
        check('PIL',   min_ver='5.2.0',  display='Pillow')
        check('cv2',   min_ver='3.4.4',  display='opencv-python')
        check('tensorflow', min_ver='1.9.0', display='tensorflow')
        check('gdown', min_ver='3.10.1', display='gdown')
        check('retinaface', display='retina-face')
        PY
        
        # Smoke test RetinaFace import and detect
        node scripts/verify-python-modules.js

    - name: Verify and test Hand environment
      run: |
        HAND_PY="$(pwd)/pythondist/hand-env/bin/python"

        # Verify core Hand requirements + the vendored native extension load.
        "$HAND_PY" - << 'PY'
        import os, sys
        root = os.getcwd()
        sys.path.insert(0, os.path.join(root, 'pythondist', 'python'))

        import numpy, PIL, cv2, yaml, easydict, scipy, torch, torchvision
        assert torch.__version__.startswith('2.11'), f"torch {torch.__version__} != 2.11.x"
        print(f"OK: torch {torch.__version__}, torchvision {torchvision.__version__}")

        # Importing the vendored package loads the native model._C extension.
        import handobj.inference  # noqa: F401
        from model.roi_layers import nms
        b = torch.tensor([[0., 0., 10., 10.], [1., 1., 11., 11.]])
        s = torch.tensor([0.9, 0.8])
        keep = nms(b, s, 0.5)
        print(f"OK: native _C extension nms -> {keep.tolist()}")

        # The hand detector must register (even before weights are present).
        from detectors import list_detectors
        d = list_detectors()
        assert 'hand_handobj' in d, f"hand_handobj not registered: {list(d)}"
        print(f"OK: hand detector registered: {d['hand_handobj']}")
        PY

    - name: Verify Python modules
      run: npm run python-verify
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: '1'
        SMOKE_TEST_YOLO: '1'
        SMOKE_TEST_RETINAFACE: '1'

    - name: Build React app
      run: |
        # Verify craco is installed locally
        npx craco --version || echo "craco version check failed"
        # Use the npm script which already sets NODE_OPTIONS and flags
        npm run react-build
      env:
        CI: false
        GENERATE_SOURCEMAP: false

    - name: Create macOS icon if missing
      run: |
        if [ ! -f resources/icon.icns ]; then
          echo "Creating icon.icns from icon.png..."
          mkdir -p resources/icon.iconset
          sips -z 16 16     resources/icon.png --out resources/icon.iconset/icon_16x16.png
          sips -z 32 32     resources/icon.png --out resources/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     resources/icon.png --out resources/icon.iconset/icon_32x32.png
          sips -z 64 64     resources/icon.png --out resources/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   resources/icon.png --out resources/icon.iconset/icon_128x128.png
          sips -z 256 256   resources/icon.png --out resources/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   resources/icon.png --out resources/icon.iconset/icon_256x256.png
          sips -z 512 512   resources/icon.png --out resources/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   resources/icon.png --out resources/icon.iconset/icon_512x512.png
          sips -z 1024 1024 resources/icon.png --out resources/icon.iconset/icon_512x512@2x.png
          iconutil -c icns resources/icon.iconset -o resources/icon.icns
          rm -rf resources/icon.iconset
        else
          echo "icon.icns already exists"
        fi

    - name: Build Electron main process
      run: |
        npx tsc -p tsconfig.electronMain.json
        # Build DMG for Apple Silicon (arm64) to match the Python architecture
        npx electron-builder --mac dmg --arm64 --publish=never
      env:
        ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        PYTHON: python3

    - name: Remove quarantine attributes from built app
      run: |
        # electron-builder writes the .app inside dist/<target>/ (e.g.
        # dist/mac-arm64/TinyExplorer Detection App.app), not directly in
        # dist/, so use `find` to locate it. Skip symlinks (-not -type l)
        # so we never try to follow a dangling link — that's what produces
        # "xattr: No such file" warnings users have reported.
        apps=$(find dist -maxdepth 3 -name '*.app' -type d)
        if [ -z "$apps" ]; then
          echo "No .app bundles found under dist/"
          exit 0
        fi
        echo "$apps" | while IFS= read -r app; do
          echo "Removing quarantine attributes from: $app"
          find "$app" -not -type l -exec xattr -d com.apple.quarantine {} \; 2>/dev/null || true
          if xattr -l "$app" 2>/dev/null | grep -q "com.apple.quarantine"; then
            echo "Warning: Quarantine still present on $app"
          else
            echo "Successfully cleaned: $app"
          fi
        done

    - name: List build artifacts
      run: ls -la dist/ || echo "No dist directory"

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-native
        path: |
          dist/*.dmg
          dist/*.zip
          dist/*.app
        if-no-files-found: warn